name: Publish Pre-Release Packages (Manual)

on:
  workflow_dispatch: {}

env:
  NuGetDirectory: ${{ github.workspace }}/nuget
  BASE_REF: origin/master # change to origin/main if needed

permissions:
  contents: read
  packages: write
  id-token: write       # required for OIDC trusted publishing


jobs:
  PackAndPublishPreRelease:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # Create suffix from the checked-out commit SHA (i.e., the target branch/ref you ran this on)
      - name: Compute prerelease suffix from git sha + run number
        id: suffix
        shell: bash
        run: |
          set -euo pipefail
          SHA8="$(git rev-parse --short=8 HEAD)"
          echo "value=-alpha-${SHA8}" >> "$GITHUB_OUTPUT"
          echo "Using version suffix: alpha-${SHA8}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (with prerelease suffix)
        run: dotnet build KnightBus.slnx --no-restore --configuration Release --version-suffix "${{ steps.suffix.outputs.value }}"

      - name: Detect version-bumped packages vs base
        id: packages
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*

          # Compare against the branch point, not the tip of master. Against the tip, a package
          # that master released after this branch was cut compares unequal, and a pre-release run
          # from the stale branch would publish it at the older version it still has here.
          BASE="$(git merge-base "${{ env.BASE_REF }}" HEAD)"
          echo "Comparing against branch point $BASE (${{ env.BASE_REF }})"

          # Read the declared version out of a csproj at a given revision, e.g. "HEAD:src/X/X.csproj".
          # Prints nothing if the file does not exist there or declares no version.
          #
          # $(VersionSuffix) is stripped so what gets compared is the release version rather than
          # the literal text. Adding or removing that token is a change to how a package builds,
          # not a new release, and should not publish anything on its own.
          version_at() {
            git show "$1" 2>/dev/null \
              | grep -oE '<(Version|VersionPrefix|PackageVersion)>[^<]*' \
              | head -n1 \
              | sed -E 's/^<[^>]+>//' \
              | sed -E 's/\$\(VersionSuffix\)//' \
              || true
          }

          # Every project on the base, indexed by project file name.
          BASE_INDEX="$(mktemp)"
          git ls-tree -r --name-only "$BASE" \
            | grep -E '\.csproj$' \
            | grep -v '/obj/' \
            | awk -F/ '{print $NF "\t" $0}' > "$BASE_INDEX"

          # Compare each project's declared version against its counterpart on the base, matched
          # by project file name rather than by path.
          #
          # Matching by name is what makes moving a project a non-event. Project file names are
          # unique across the repository and are the published package ids, so the same name is
          # the same package wherever it sits. A diff cannot express that: `git diff -- <path>`
          # limits the pathspec to the new path, so git never sees the deletion at the old path
          # to pair it with, reports the file as wholly added, and every line - including an
          # untouched <Version> - reads as a bump. Rename detection does not save it either,
          # since a project file that also changed can fall below the similarity threshold.
          # Either way a repository restructure would publish every package at its current
          # version, and it would do so silently.
          PACK_PROJECTS=()

          while IFS= read -r head_path; do
            name="$(basename "$head_path")"
            base_path="$(awk -F'\t' -v n="$name" '$1 == n {print $2; exit}' "$BASE_INDEX")"

            head_version="$(version_at "HEAD:$head_path")"
            base_version=""
            if [[ -n "$base_path" ]]; then
              base_version="$(version_at "$BASE:$base_path")"
            fi

            # Unversioned projects - tests and samples - compare equal and are skipped.
            if [[ "$head_version" != "$base_version" ]]; then
              echo "Version change detected in $head_path: ${base_version:-none} -> ${head_version:-none}"
              PACK_PROJECTS+=("$head_path")
            fi
          done < <(git ls-tree -r --name-only HEAD | grep -E '\.csproj$' | grep -v '/obj/')

          if [[ ${#PACK_PROJECTS[@]} -eq 0 ]]; then
            echo "No version bumps detected."
            echo "hasPackages=false" >> "$GITHUB_OUTPUT"
            echo "packProjects=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "hasPackages=true"
            echo "packProjects<<EOF"
            printf "%s\n" "${PACK_PROJECTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pack bumped packages (with prerelease suffix)
        if: steps.packages.outputs.hasPackages == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ env.NuGetDirectory }}"

          while IFS= read -r proj; do
            [[ -z "$proj" ]] && continue
            echo "Packing $proj"
            dotnet pack "$proj" \
              --no-build \
              --configuration Release \
              --output "${{ env.NuGetDirectory }}" \
              --version-suffix "${{ steps.suffix.outputs.value }}"
          done <<< "${{ steps.packages.outputs.packProjects }}"

      - name: Upload packages artifact
        if: steps.packages.outputs.hasPackages == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-prerelease
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*.nupkg

      - name: NuGet login (OIDC → temp API key)
        if: steps.packages.outputs.hasPackages == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push prerelease packages to NuGet.org
        if: steps.packages.outputs.hasPackages == 'true'
        shell: pwsh
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
